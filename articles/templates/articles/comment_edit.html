{% extends 'base.html' %}
{% block title %}Редактировать комментарий{% endblock %}
{% block content %}
<div class="card shadow-sm p-4">
    <h3 class="fw-bold mb-3">Редактирование комментария</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'article_detail' comment.article.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
